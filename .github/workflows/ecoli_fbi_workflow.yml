name: ecoli food bourne infection workflow

on:
  push:
    branches: ["main"]
    tags-ignore:
      - "**"
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      matrix:
        os: ["ubuntu-latest"]
        python-version: ["3.11"]

    steps:
      # step 1: checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # step 2 use environment.yml dependencies to create conda environment
      - name: Set up miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          environment-file: environment.yml
          activate-environment: ecoli_pipeline
          python-version: ${{ matrix.python-version }}

      # step 3
      - name: Run test script
        run: |
          conda activate ecoli_pipeline
          make test

      # step 4
      - name: Check git tag and create a new tag if tests pass
        if: ${{ success() }}
        run: |
          COMMIT_SHORT=$(git rev-parse --short=7 HEAD)
          DIR_NAME=$(basename $(pwd))
          TAG_NAME="${DIR_NAME}.${GITHUB_SHA::7}.$(date +%Y%m%d)"
          git tag $TAG_NAME
          git push origin $TAG_NAME --no-verify
          echo "$TAG_NAME"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # Step 5: Trigger bifrost_sp_ecoli workflow
      - name: Workflow dispatch with API - trigger bifrost_sp_ecoli workflow 
        if: ${{ success() }}
        run: |
            curl -v -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.FBI_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/ssi-dk/bifrost_sp_ecoli/dispatches \
            -d '{"event_type":"ecoli-fbi-webhook"}'